name: Publish web app

# Publishes the same app as a website (for iPhones and other browsers) at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/vendor
          cp -r app/src/main/assets/www/. _site/
          cp -r web/. _site/
          # PDF.js shows PDF sheet music in the browser (the Android app uses Android's own PDF renderer)
          npm pack pdfjs-dist@4 --silent
          tar xzf pdfjs-dist-*.tgz
          for f in pdf pdf.worker; do
            cp "package/legacy/build/$f.min.mjs" "_site/vendor/$f.min.mjs" 2>/dev/null \
              || cp "package/legacy/build/$f.mjs" "_site/vendor/$f.min.mjs"
          done
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}/" _site/sw.js
          # Web version number matches the Android build made from the same commit (1.N)
          n=""
          for i in 1 2 3 4 5 6; do
            n=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" -L 1 --json number -q '.[0].number' 2>/dev/null)
            [ -n "$n" ] && break; sleep 5
          done
          [ -n "$n" ] || n=$(gh run list --workflow build.yml -L 1 --json number -q '.[0].number' 2>/dev/null)
          ver="1.${n:-0}|$(date -u +%F)"; echo "Web version $ver"
          sed -i "s/__WEB_VERSION__/$ver/" _site/index.html
          touch _site/.nojekyll
          ls -la _site _site/vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
