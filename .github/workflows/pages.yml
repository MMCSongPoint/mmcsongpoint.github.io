name: Publish web app

# Publishes the same app as a website (for iPhones and other browsers) at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**', '.github/workflows/desktop.yml' ]   # the Windows app builds on its own
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the version number and build log come from it

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/vendor
          cp -r app/src/main/assets/www/. _site/
          cp -r web/. _site/
          # PDF.js shows PDF sheet music in the browser (the Android app uses Android's own PDF renderer)
          npm pack pdfjs-dist@4 --silent
          tar xzf pdfjs-dist-*.tgz
          for f in pdf pdf.worker; do
            cp "package/legacy/build/$f.min.mjs" "_site/vendor/$f.min.mjs" 2>/dev/null \
              || cp "package/legacy/build/$f.mjs" "_site/vendor/$f.min.mjs"
          done
          # heic2any opens iPhone (HEIC) pictures added in the presenter (only Safari can open them itself)
          mkdir -p /tmp/heic && (cd /tmp/heic && npm pack heic2any@0.0.4 --silent && tar xzf heic2any-*.tgz)
          cp /tmp/heic/package/dist/heic2any.min.js _site/vendor/heic2any.min.js
          # jsQR reads a leader's QR code from the camera where the browser has no reader of its own
          mkdir -p /tmp/jsqr && (cd /tmp/jsqr && npm pack jsqr@1.4.0 --silent && tar xzf jsqr-*.tgz)
          cp /tmp/jsqr/package/dist/jsQR.js _site/vendor/jsQR.js
          # recorded instrument sounds for MIDI songs (FluidR3 GM, CC BY 3.0, from midi-js-soundfonts)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/gleitz/midi-js-soundfonts.git /tmp/sf
          (cd /tmp/sf && git sparse-checkout set --no-cone /FluidR3_GM/acoustic_grand_piano-mp3.js /FluidR3_GM/church_organ-mp3.js /FluidR3_GM/choir_aahs-mp3.js /FluidR3_GM/string_ensemble_1-mp3.js /FluidR3_GM/acoustic_guitar_nylon-mp3.js /FluidR3_GM/flute-mp3.js /FluidR3_GM/accordion-mp3.js /FluidR3_GM/orchestral_harp-mp3.js /FluidR3_GM/tubular_bells-mp3.js /FluidR3_GM/harmonica-mp3.js /FluidR3_GM/tinkle_bell-mp3.js /FluidR3_GM/acoustic_bass-mp3.js)
          mkdir -p _site/sounds && cp /tmp/sf/FluidR3_GM/*-mp3.js _site/sounds/
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}/" _site/sw.js
          # Same version as the Android build from this commit: 1.<server version>.<commits since it changed>
          v=$(python3 .github/scripts/version.py _site/buildlog.js)
          ver="$v|$(date -u +%F)"; echo "Web version $ver"
          sed -i "s/__WEB_VERSION__/$ver/" _site/index.html
          touch _site/.nojekyll
          ls -la _site _site/vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
