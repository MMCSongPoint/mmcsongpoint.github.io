name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret set - signing with a temporary key. Phones won't be able to update over this build later."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        # MMC-SongPoint.apk is the new name; HymnalTracks.apk keeps old download links working
        run: |
          cp app/build/outputs/apk/release/app-release.apk MMC-SongPoint.apk
          cp MMC-SongPoint.apk HymnalTracks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MMC-SongPoint
          path: MMC-SongPoint.apk

      - name: Publish release
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MMC SongPoint 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            MMC-SongPoint.apk
            HymnalTracks.apk
          body: |
            Install on Android: download **MMC-SongPoint.apk** below on your phone and open it.
            Permanent link to the newest version:
            https://github.com/${{ github.repository }}/releases/latest/download/MMC-SongPoint.apk
