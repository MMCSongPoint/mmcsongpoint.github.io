name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**', '.github/workflows/desktop.yml' ]   # the Windows app builds on its own
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the version number and build log come from it

      - name: Version and build log
        # 1.<server version>.<commits since the server version changed>; the app shows the log in Settings › About
        run: |
          v=$(python3 .github/scripts/version.py app/src/main/assets/www/buildlog.js)
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"; echo "Version $v"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret set - signing with a temporary key. Phones won't be able to update over this build later."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        # MMCSongPoint-<version>.apk is what people download; the fixed names keep the permanent link and older app versions working
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MMCSongPoint-${{ env.APP_VERSION }}.apk"
          cp "MMCSongPoint-${{ env.APP_VERSION }}.apk" MMCSongPoint.apk
          cp MMCSongPoint.apk MMC-SongPoint.apk
          cp MMCSongPoint.apk HymnalTracks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MMCSongPoint-${{ env.APP_VERSION }}
          path: MMCSongPoint-${{ env.APP_VERSION }}.apk

      - name: Publish release
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MMC SongPoint ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            MMCSongPoint-${{ env.APP_VERSION }}.apk
            MMCSongPoint.apk
            MMC-SongPoint.apk
            HymnalTracks.apk
          body: |
            Install on Android: download **MMCSongPoint-${{ env.APP_VERSION }}.apk** below on your phone and open it.
            Permanent link to the newest version:
            https://github.com/${{ github.repository }}/releases/latest/download/MMCSongPoint.apk
