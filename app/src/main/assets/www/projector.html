<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SongPoint · Projector</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.ui { cursor: default; }
  /* the next slide, picture, title or video fades in on top of the one showing, which stays until it's covered
     (so there's no dip to black between them). FADE, below, is the same time. Black behind a picture's bars. */
  .slide { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; transition: opacity .5s ease; }
  .instant { transition: none !important; }
  .slide.on { opacity: 1; }
  #title { position: fixed; inset: 0; background: #000; display: grid; place-items: center; text-align: center; color: #fff; font: 700 6vw/1.2 system-ui, sans-serif; padding: 5vw; opacity: 0; transition: opacity .5s ease; }
  #title.on { opacity: 1; }
  #live { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
  #live.on { display: block; z-index: 1000000; }
  #vid { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; visibility: hidden; opacity: 0; transition: opacity .5s ease, visibility 0s .5s; }
  #vid.on { visibility: visible; opacity: 1; transition: opacity .5s ease, visibility 0s; }
  /* the CCLI licence notice, bottom right, on each song's first slide */
  #ccli { position: fixed; right: 1.6vw; bottom: 1.3vw; z-index: 999999; color: #fff; font: 600 1.5vw/1.2 system-ui, sans-serif; background: rgba(0,0,0,.55); border-radius: .3em; padding: .15em .5em; white-space: nowrap; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #ccli.on { opacity: 1; }
</style>
</head>
<body class="ui">
<img class="slide" alt=""><img class="slide" alt="">
<div id="title"></div>
<div id="ccli"></div>
<video id="vid" playsinline preload="auto"></video>
<iframe id="live" allow="autoplay; fullscreen" allowfullscreen title="Speaker slides"></iframe>
<script>
// Shows whatever the Presenter window (same app, same computer) sends over a BroadcastChannel.
const ch = new BroadcastChannel('songpoint-projector'), title = document.getElementById('title'), live = document.getElementById('live');
const FADE = 500;
// two picture layers: the next slide loads into the hidden one, then fades in over the one fading out
const layers = [...document.querySelectorAll('.slide')]; let front = 0, want = '';
// what's coming in goes on top and fades in; what it covers is taken away (no fade) once it's fully covered
const all = () => [...layers, title, vid];
let zTop = 1;
function cut(el) {
  el.classList.add('instant'); el.classList.remove('on'); void el.offsetWidth; el.classList.remove('instant');
  if (el === vid) { vWant = false; clearInterval(vTimer); clearTimeout(vHideT); vid.pause(); }
}
function swapTo(el) {
  if (el.classList.contains('on') && +el.style.zIndex === zTop) return;
  const mine = ++zTop; el.style.zIndex = mine; el.classList.add('on');
  for (const o of all()) if (o !== el && o.classList.contains('on'))
    setTimeout(() => { if (+el.style.zIndex === mine && el.classList.contains('on') && +o.style.zIndex < mine) cut(o); }, FADE + 60);
}
const img = { classList: { remove: () => { want = ''; layers.forEach(l => l.classList.remove('on')); } } };   // "hide the slide"
async function showSlide(src) {
  const cur = layers[front];
  if (want === src && cur.classList.contains('on')) return;
  want = src;
  if (cur.getAttribute('src') === src) { swapTo(cur); return; }
  const next = layers[1 - front];
  next.src = src;
  try { await next.decode(); } catch (e) {}
  if (want !== src) return;   // another slide came meanwhile
  front = 1 - front; swapTo(next);
}
// the CCLI notice sits in the slide's own bottom-right corner (inside the picture, not on the black bars beside it)
let ccliFor = '';
function placeCcli(src) {
  ccliFor = src; const cc = document.getElementById('ccli'), W = innerWidth, H = innerHeight;
  let x = 0, y = 0, w = W, h = H;
  if (src) {
    const probe = new Image(); probe.src = src;
    const set = () => { if (ccliFor !== src || !probe.naturalWidth) return; const r = Math.min(W / probe.naturalWidth, H / probe.naturalHeight); w = probe.naturalWidth * r; h = probe.naturalHeight * r; x = (W - w) / 2; y = (H - h) / 2; put(); };
    if (probe.complete) set(); else probe.onload = set;
  }
  function put() { cc.style.right = (x + w * 0.016) + 'px'; cc.style.bottom = (y + h * 0.035) + 'px'; cc.style.fontSize = Math.max(12, w * 0.015) + 'px'; }
  put();
}
addEventListener('resize', () => { if (document.getElementById('ccli').classList.contains('on')) placeCcli(ccliFor); });
// a speaker's deck playing in Google Slides' own player: the clicker / arrow keys go straight to it
function showLive(m) {
  img.classList.remove('on'); title.classList.remove('on');
  if (live.dataset.url !== m.url) { live.dataset.url = m.url; live.src = m.url; }
  live.classList.add('on'); placeLive();
  if (m.focus) { window.focus(); setTimeout(() => { try { live.focus(); live.contentWindow.focus(); } catch (e) {} }, 300); }
}
// Microsoft's PowerPoint viewer puts a control bar under the slide and a thin frame round it. Its window is made a
// little bigger than the screen, so the 16:9 slide fills the screen and the bar and frame fall off the edges (a little
// extra all round hides any black edge the viewer leaves).
const OFFICE_BAR = 24, OFFICE_EDGE = 2, OFFICE_OVER = 0.012;
function placeLive() {
  if (!/officeapps\.live\.com/.test(live.dataset.url || '')) { live.style.cssText = ''; return; }
  const W = innerWidth, H = innerHeight, w0 = Math.min(W, H * 16 / 9), w = w0 * (1 + 2 * OFFICE_OVER), h = w * 9 / 16;
  Object.assign(live.style, { inset: 'auto', left: (W - w) / 2 - OFFICE_EDGE + 'px', top: (H - h) / 2 - OFFICE_EDGE + 'px',
    width: w + 2 * OFFICE_EDGE + 'px', height: h + 2 * OFFICE_EDGE + OFFICE_BAR + 'px' });
}
addEventListener('resize', placeLive);
live.addEventListener('load', () => { if (live.classList.contains('on')) try { live.focus(); live.contentWindow.focus(); } catch (e) {} });
// a video added in the presenter: it plays here, with sound. The presenter says play / pause; this reports back.
const vid = document.getElementById('vid');
let vWant = false, vBlocked = false, vSn = -1, vTimer = 0;
function vStat() { ch.postMessage({ t: 'vstat', url: vid.dataset.url || '', time: vid.currentTime || 0, dur: vid.duration || 0, ended: vid.ended, blocked: vBlocked }); }
function vPlay() { vid.play().then(() => { vBlocked = false; vStat(); }).catch(() => { vBlocked = true; vStat(); }); }
function showVideo(m) {
  if (vid.dataset.url !== m.url) { vid.dataset.url = m.url; vid.src = m.url; vSn = -1; }
  vid.loop = !!m.loop;
  if ((m.sn || 0) !== vSn) { vSn = m.sn || 0; try { vid.currentTime = m.st || 0; } catch (e) {} }   // the presenter moved the time bar
  clearTimeout(vHideT); swapTo(vid); vWant = !!m.play;
  if (vWant && vid.paused && !vid.ended) vPlay(); else if (!vWant && !vid.paused) vid.pause();
  clearInterval(vTimer); vTimer = setInterval(vStat, 500);
}
let vHideT = 0;
function hideVideo() {   // fades out, then stops
  if (!vid.classList.contains('on')) return;
  vid.classList.remove('on'); vWant = false; clearInterval(vTimer);
  clearTimeout(vHideT); vHideT = setTimeout(() => { if (!vid.classList.contains('on')) vid.pause(); }, FADE);
}
vid.addEventListener('ended', vStat);
document.addEventListener('pointerdown', () => { if (vBlocked && vWant) vPlay(); });   // sound needs a click here once
ch.onmessage = e => {
  const m = e.data || {};
  if (m.t !== 'live' && m.t !== 'close') live.classList.remove('on');
  if (m.t !== 'video' && m.t !== 'slide' && m.t !== 'title') hideVideo();   // a slide or title covers a video instead
  const cc = document.getElementById('ccli');
  if (m.t === 'slide' || m.t === 'title') { if (m.ccli) { cc.textContent = m.ccli; placeCcli(m.t === 'slide' ? m.img : ''); } cc.classList.toggle('on', !!m.ccli); }
  else if (m.t !== 'close') cc.classList.remove('on');
  if (m.t === 'video') showVideo(m);
  else if (m.t === 'live') showLive(m);
  else if (m.t === 'slide') showSlide(m.img);
  else if (m.t === 'title') {
    if (title.classList.contains('on') && +title.style.zIndex === zTop) title.textContent = m.text || '';
    else { title.textContent = m.text || ''; swapTo(title); }
  }
  else if (m.t === 'blank') { img.classList.remove('on'); title.classList.remove('on'); }
  else if (m.t === 'close') window.close();
};
ch.postMessage({ t: 'hello' });
addEventListener('pagehide', () => ch.postMessage({ t: 'bye' }));
// Full screen. The presenter opens this window on the projector screen and passes on the go-ahead (a click or key
// press there), or it goes full screen straight away where the browser allows it. Double-click or F works here too.
// target: the projector screen's position (from the presenter), so full screen lands there even if the window didn't.
async function goFull(target) {
  if (document.fullscreenElement) return;
  try {
    if (target && 'getScreenDetails' in window) {
      const q = await navigator.permissions.query({ name: 'window-management' });
      if (q.state === 'granted') {
        const sd = await window.getScreenDetails(), scr = sd.screens.find(x => x.availLeft === target.left && x.availTop === target.top);
        if (scr) { await document.documentElement.requestFullscreen({ screen: scr }); return; }
      }
    }
  } catch (e) {}
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
}
window.addEventListener('message', e => { const m = e.data || {}; if (e.origin === location.origin && m.t === 'full') goFull(m.target); });
goFull();
document.addEventListener('dblclick', () => goFull());
document.addEventListener('fullscreenchange', () => { const fs = !!document.fullscreenElement; document.body.classList.toggle('ui', !fs); ch.postMessage({ t: 'fs', on: fs }); });
document.addEventListener('keydown', e => { if (vBlocked && vWant) return vPlay(); if (e.key === 'f' || e.key === 'F') goFull(); else ch.postMessage({ t: 'key', key: e.key }); });   // a clicker pressed here still works
</script>
</body>
</html>
