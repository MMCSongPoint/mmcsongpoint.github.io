<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#72173b">
<title>MMC SongPoint</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SongPoint">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<script src="web.js"></script>
<style>
  /* Brand color #72173b. --accent fills buttons; --accent-text is for colored text/borders. */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141013; --panel: #1d171b; --row: #271f24; --line: #352a31; --raised: #2f262c;
    --text: #f3ecef; --muted: #a8989f; --accent: #72173b; --accent-ink: #ffffff; --accent-text: #e48aae;
    --danger: #ff7a7a; --ok: #5fcf96; --mark: rgba(228,138,174,.28); --scrim: rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f7f2f4; --panel: #ffffff; --row: #f4ebef; --line: #e7dbe1; --raised: #ffffff;
      --text: #1f1519; --muted: #6e5f66; --accent: #72173b; --accent-ink: #ffffff; --accent-text: #72173b;
      --danger: #c62828; --ok: #1e8e5a; --mark: rgba(114,23,59,.16); --scrim: rgba(30,10,20,.35);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f2f4; --panel: #ffffff; --row: #f4ebef; --line: #e7dbe1; --raised: #ffffff;
    --text: #1f1519; --muted: #6e5f66; --accent: #72173b; --accent-ink: #ffffff; --accent-text: #72173b;
    --danger: #c62828; --ok: #1e8e5a; --mark: rgba(114,23,59,.16); --scrim: rgba(30,10,20,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: contain; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 900px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 190px calc(14px + env(safe-area-inset-left)); }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand { font-weight: 750; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
  .brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; font-style: normal; color: #fff; font-size: 14px; flex: none; }
  .hbtn { background: var(--row); border: 1px solid var(--line); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .syncline { color: var(--muted); font-size: 12.5px; margin: -4px 2px 10px; min-height: 16px; }
  .syncline.err { color: var(--danger); }

  .search { position: relative; }
  .search input { width: 100%; padding: 13px 44px 13px 44px; font-size: 17px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); outline: none; -webkit-appearance: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { border-color: var(--accent-text); }
  .search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); width: 36px; height: 36px; display: none; font-size: 20px; }
  .search.has .clear { display: block; }

  .scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .scroller::-webkit-scrollbar { display: none; }
  .tabs { margin: 12px -14px 0; padding: 0 14px; border-bottom: 1px solid var(--line); gap: 2px; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 11px; color: var(--muted); white-space: nowrap; font-weight: 500; font-size: 15px; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent-text); }
  .tab small { color: var(--muted); font-weight: 400; margin-left: 3px; font-size: 12px; }

  .bar { display: flex; align-items: center; gap: 8px; margin: 10px 0 8px; }
  .bar .label { color: var(--muted); font-size: 13px; flex: none; }
  .chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .chip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .meta-bar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin: 2px 2px 8px; gap: 8px; }
  select { background: var(--row); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13.5px; }

  .list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .song { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 4px 10px; padding: 10px 8px 10px 10px; border-top: 1px solid var(--line); }
  .song:first-child { border-top: none; }
  .song.sel { background: var(--row); }
  .play { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--row); display: grid; place-items: center; }
  .song.playing .play { background: var(--accent); color: var(--accent-ink); }
  .info { min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song.playing .title { color: var(--accent-text); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; margin-right: 6px; }
  .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 500; vertical-align: 1px; }
  .dl { width: 38px; height: 38px; border: none; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 8px; }
  .dl.done { color: var(--ok); }
  .dl.busy svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .acts { display: flex; align-items: center; }
  .sm { color: var(--accent-text); }
  .parts { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; }
  .pp { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pp.mine { color: var(--text); border-color: var(--accent-text); }
  .pp.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { padding: 48px 18px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  .toast { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); background: var(--raised); color: var(--text); box-shadow: 0 4px 18px rgba(0,0,0,.18); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }

  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); box-shadow: 0 -2px 14px rgba(0,0,0,.12); border-top: 1px solid var(--line); padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); display: none; z-index: 40; }
  .player.show { display: block; }
  .player .in { max-width: 900px; margin: 0 auto; }
  .prow { display: flex; align-items: center; gap: 10px; }
  .prow .info { flex: 1; }
  .ctrls { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 2px; }
  .icon { background: none; border: none; color: var(--muted); min-width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
  .icon.on { color: var(--accent-text); }
  .big { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: none; display: grid; place-items: center; }
  .seek { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent-text); height: 28px; }
  .pparts { margin-top: 6px; }
  .extras { display: flex; align-items: center; gap: 6px; }

  /* sheet music viewer */
  .viewer { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: none; flex-direction: column; }
  .viewer.show { display: flex; }
  .vhead { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 8px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .vhead .info { flex: 1; }
  .vtabs { padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .vtabs:empty { display: none; }
  .vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; background: #e9e4e6; }
  :root[data-theme="dark"] .vbody { background: #0b0809; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vbody { background: #0b0809; } }
  .pages { width: 100%; margin: 0 auto; }
  .pages img { display: block; width: 100%; height: auto; background: #fff; margin: 0 auto 8px; }
  .vmsg { padding: 60px 20px; text-align: center; color: var(--muted); }
  .zoom { position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  /* password screen */
  .lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; place-items: center; padding: 24px; }
  .lock.show { display: grid; }
  .lock form { width: min(360px, 100%); text-align: center; }
  .lock .logo { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; margin: 0 auto 14px; }
  .lock h2 { margin: 0 0 6px; }
  .lock p { color: var(--muted); margin: 0 0 20px; }
  .lock input { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; text-align: center; }
  .lock input:focus { border-color: var(--accent-text); }
  .lock button { width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; }
  .lock .err { color: var(--danger); min-height: 22px; margin-top: 10px; font-size: 14px; }
  .install { display: none; align-items: center; gap: 10px; background: var(--row); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }
  .install.show { display: flex; }
  .install span { flex: 1; }
  .install button { background: none; border: none; color: var(--muted); font-size: 20px; padding: 0 4px; }
  .sheet-bg { position: fixed; inset: 0; background: var(--scrim); display: none; z-index: 70; }
  .sheet-bg.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 18px 18px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); z-index: 71; transform: translateY(110%); transition: transform .2s; max-width: 900px; margin: 0 auto; }
  .sheet.show { transform: none; }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
  .sheet .act { display: block; width: 100%; text-align: left; background: var(--row); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-top: 8px; font-size: 15px; }
  .sheet .act.danger { color: var(--danger); }
  .sheet h4 { margin: 20px 0 8px; font-size: 15px; }
  .seg { display: flex; background: var(--row); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 6px; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i>♪</i><span id="appName">MMC SongPoint</span></div>
    <button class="hbtn" id="syncBtn" title="Check Drive for new songs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    <button class="hbtn" id="menuBtn" title="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <div class="syncline" id="syncLine"></div>
  <div class="install" id="installTip"><span>Install on your iPhone: tap <b>Share</b> <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg> then <b>Add to Home Screen</b>.</span><button id="installClose" aria-label="Dismiss">×</button></div>

  <div class="search" id="searchBox">
    <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Title or hymn number" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clearQ" aria-label="Clear">×</button>
  </div>

  <div class="tabs scroller" id="tabs"></div>
  <div class="meta-bar">
    <span id="status"></span>
    <select id="sort">
      <option value="title">Title A–Z</option>
      <option value="number">Hymn number</option>
      <option value="recent">Recently added</option>
      <option value="plays">Most played</option>
    </select>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>

<div class="player" id="player">
  <div class="in">
    <div class="prow">
      <div class="info"><div class="title" id="nowTitle"></div><div class="sub" id="nowSub"></div></div>
      <div class="extras">
        <button class="icon sm" id="musicBtn" title="Sheet music" style="display:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M10 17.5a1.5 1.5 0 1 1-1.5-1.5H10v-6l4-1"/></svg></button>
        <button class="icon" id="loopBtn" title="Repeat">⟲</button>
        <select id="rate" title="Speed"><option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option></select>
      </div>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="len">0:00</span></div>
    <div class="ctrls">
      <button class="icon" id="prevBtn" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="icon" id="backBtn">−5</button>
      <button class="big" id="toggleBtn" aria-label="Play or pause"></button>
      <button class="icon" id="fwdBtn">+5</button>
      <button class="icon" id="nextBtn" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="scroller pparts" id="playerParts"></div>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<div class="viewer" id="viewer">
  <div class="vhead">
    <button class="icon" id="vClose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="info"><div class="title" id="vTitle"></div><div class="sub" id="vSub"></div></div>
    <button class="icon" id="vPlay" aria-label="Play"></button>
  </div>
  <div class="vtabs scroller" id="vTabs"></div>
  <div class="vbody" id="vBody"><div class="pages" id="vPages"></div></div>
  <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button></div>
</div>

<div class="lock" id="lock">
  <form id="lockForm" autocomplete="off">
    <div class="logo">♪</div>
    <h2 id="lockTitle">MMC SongPoint</h2>
    <p>Enter the password to continue.</p>
    <input id="lockPw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
    <button type="submit">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>Settings</h3>
  <h4 style="margin-top:12px">Offline songs</h4>
  <p id="storageInfo" style="margin-top:0"></p>
  <button class="act" id="dlPartBtn"></button>
  <button class="act danger" id="clearDlBtn">Remove all saved songs</button>
  <h4>Appearance</h4>
  <div class="seg" id="themeSeg">
    <button data-t="system">Match device</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
  </div>
  <p style="margin-top:16px" id="aboutLine"></p>
</div>

<script>
'use strict';
const CFG = Object.assign({ appName: 'MMC SongPoint', syncMinutes: 30, collectionOrder: [], driveApi: 'https://www.googleapis.com' }, window.HYMNAL_CONFIG || {});
// Android app: window.Native (Java). Website / iPhone: window.WebNative (web.js). Opened as a local file: none.
const N = (window.Native && window.Native.isAndroid ? window.Native : null) || window.WebNative || null;
const $ = s => document.querySelector(s);
const audio = $('#audio');
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const BIG_PLAY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const BIG_PAUSE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const ICON_MUSIC = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M10 17.5a1.5 1.5 0 1 1-1.5-1.5H10v-6l4-1"/></svg>';
const ICON_DL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';
const ICON_DONE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>';
$('#appName').textContent = CFG.appName; document.title = CFG.appName;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ------------------------------------------------------------------ text helpers
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (s == null || !isFinite(s)) return ''; s = Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/['’]/g, '').toLowerCase();
const normalize = s => fold(s).replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
function trigrams(t) { const p = `  ${t} `, out = new Set(); for (let i = 0; i < p.length - 2; i++) out.add(p.slice(i, i + 3)); return out; }
function toast(msg, ms = 3200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

// ------------------------------------------------------------------ file-name parsing
// "0002 We Praise Thee O God-w-opt end 1.mp3"  -> #2, "We Praise Thee O God", "With optional ending"
// "Agnus_Dei_-_All_parts.mp3"                   -> "Agnus Dei", "All parts"
// "123 - Amazing Grace - Soprano.mp3"           -> #123, "Amazing Grace", "Soprano"
const VOICES = '(?:soprano|alto|tenor|bass|baritone|melody|harmony|lead|descant|treble)';
const PART_RE = new RegExp(`^(?:all\\s*parts?|full(?:\\s+(?:mix|choir))?|satb|choir|accompaniment|piano(?:\\s+only)?|instrumental|${VOICES}(?:\\s*(?:[12]|i{1,2}))?(?:\\s+(?:part|only|predominant|dominant|emphasis|emphasized|solo|line))?|[satb][12]?)$`, 'i');
const TRAILING_PART_RE = new RegExp(`[\\s(\\[]+(${VOICES}(?:\\s*[12])?|all\\s*parts?)[)\\]]?$`, 'i');
const VARIANT_RE = /(?<=\S)-w-?\s*(.+)$/i;
const TIGHT_SUFFIX_RE = /(?<=[^\s\d])-([A-Za-z]{2,12})$/;

const PART_ORDER = ['all parts', 'standard', 'soprano', 'alto', 'tenor', 'bass'];
const DEFAULT_PART = 'Standard';

function tidyPart(p) {

  if (/^all\s*parts?$/i.test(p)) return 'All parts';
  const m = p.match(/^([satb])([12]?)$/i);
  if (m) return { s: 'Soprano', a: 'Alto', t: 'Tenor', b: 'Bass' }[m[1].toLowerCase()] + (m[2] ? ' ' + m[2] : '');
  return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();

function parseName(filename) {

  if ((m = stem.match(/^#?(\d{1,5})([a-z]?)(?:\s*[-.):]\s*|\s+)(?=\S)/i))) {

    if (pieces.length > 1 && PART_RE.test(pieces[pieces.length - 1])) part = tidyPart(pieces.pop());
    else if ((m = stem.match(TRAILING_PART_RE)) && m.index > 0) {
      part = tidyPart(m[1]);

const SMALL_WORDS = new Set(['a','an','and','as','at','but','by','for','from','in','into','nor','of','on','or','the','to','with','o\'er']);

function parseSheet(filename) {
  if (/\bsection\b/i.test(filename)) return null;            // book section title pages
  const ext = (filename.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
  if (!/^(png|jpe?g|pdf)$/.test(ext)) return null;
  const stem = filename.slice(0, -(ext.length + 1)).replace(/_/g, ' ').trim();
  let m;
  if ((m = stem.match(/^#?(\d{1,5})([a-z]?)(?:\s*(?:p(?:age)?\s*)?(\d+))?$/i)))
    return { ext, number: String(parseInt(m[1], 10)), title: '', label: 'Sheet music', page: +(m[3] || 0) };

  if ((m = stem.match(/^(.+?)-(vocal|lead|piano|choral|satb|chord|chords|guitar|[a-z]+)-([A-G][#b]?m?)$/i))) { title = m[1]; kind = m[2]; key = m[3]; }
  const p = parseName(title + '.x');
  const label = kind ? `${kind.charAt(0).toUpperCase() + kind.slice(1).toLowerCase()} · ${key}` : 'Sheet music';

const baseTitle = t => t.replace(/\s*\([^)]*\)\s*$/, '').trim();
function buildIndex() {
  songIndex = new Map();
  const newSong = (key, x) => ({ key, number: x.number, collection: x.collection, subfolder: x.subfolder || '', parts: [], sheets: [], modified: '' });
  for (const t of library.tracks) {
    const key = t.collection + '|' + (t.number ? '#' + t.number : normalize(t.title));
    let s = songIndex.get(key);
    if (!s) songIndex.set(key, s = newSong(key, t));
    s.parts.push(t);
    if ((t.modified || '') > s.modified) s.modified = t.modified || '';
  }
  // Sheet music: numbered pages join the hymn with that number; titled PDFs join the song
  // with the same title, or the same title without its "(alternate name)".
  const sheets = library.sheets || [];
  const exactTitles = new Set(sheets.filter(x => !x.number).map(x => x.collection + '|' + normalize(x.title)));
  for (const x of sheets) {
    let key = x.collection + '|' + (x.number ? '#' + x.number : normalize(x.title)), s = songIndex.get(key);
    if (!s && !x.number) {
      const base = x.collection + '|' + normalize(baseTitle(x.title));
      if (songIndex.has(base) && songIndex.get(base).parts.length && !exactTitles.has(base)) { key = base; s = songIndex.get(base); }
    }
    if (!s) songIndex.set(key, s = newSong(key, x));
    s.sheets.push(x);
    if (!s.parts.length && (x.modified || '') > s.modified) s.modified = x.modified || '';
  }
  for (const s of songIndex.values()) {
    s.parts.sort((a, b) => partRank(a.part) - partRank(b.part) || a.part.localeCompare(b.part));
    const kindRank = l => { const i = ['vocal', 'choral', 'satb', 'piano', 'lead'].findIndex(k => l.toLowerCase().startsWith(k)); return i < 0 ? 9 : i; };
    s.sheets.sort((a, b) => kindRank(a.label) - kindRank(b.label) || a.label.localeCompare(b.label) || a.page - b.page || a.name.localeCompare(b.name));

async function driveList(folderId) {
  const out = [];
  let pageToken = '';
  do {
    const params = new URLSearchParams({
      q: `'${folderId}' in parents and trashed = false`,
      fields: 'nextPageToken, files(id,name,mimeType,size,modifiedTime)',
      pageSize: '1000', key: CFG.apiKey, supportsAllDrives: 'true', includeItemsFromAllDrives: 'true',
    });
    if (pageToken) params.set('pageToken', pageToken);
    const r = await fetch(`${CFG.driveApi}/drive/v3/files?${params}`);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = body.error && body.error.message || `HTTP ${r.status}`;
      if (/API key not valid|API_KEY_INVALID/i.test(msg)) throw new Error('The app\'s Google API key is not valid.');
      if (r.status === 404) throw new Error('Can\'t open the Drive folder. Make sure it is shared as “Anyone with the link”.');
      throw new Error(msg);
    }
    out.push(...(body.files || []));
    pageToken = body.nextPageToken || '';
  } while (pageToken);
  return out;
}

let syncing = false;
async function sync(manual = false) {
  if (syncing) return;
  if (!CFG.apiKey || CFG.apiKey.startsWith('PASTE')) { setSyncLine('The app is missing its Google API key (config.js).', true); return; }
  if (!navigator.onLine) { setSyncLine(library.synced ? `Offline · last updated ${ago(library.synced)}` : 'You\'re offline.', !library.synced); if (manual) toast('No internet connection'); return; }
  syncing = true; $('#syncBtn').classList.add('spin'); setSyncLine('Checking Google Drive…');
  try {
    const tracks = [], seenColl = [];
    const stack = [{ id: CFG.rootFolder, path: '', collection: null }];
    while (stack.length) {
      const { id, path, collection } = stack.shift();
      for (const f of await driveList(id)) {
        if (f.mimeType === 'application/vnd.google-apps.folder') {
          stack.push(collection === null
            ? { id: f.id, path: '', collection: f.name }
            : { id: f.id, path: (path ? path + '/' : '') + f.name, collection });
          continue;
        }
        if (!(f.mimeType === 'audio/mpeg' || /\.mp3$/i.test(f.name))) continue;
        const coll = collection || 'Other';
        if (!seenColl.includes(coll)) seenColl.push(coll);
        const p = parseName(f.name);
        tracks.push({ id: f.id, name: f.name, number: p.number, title: p.title, part: p.part,
          collection: coll, subfolder: path, size: +f.size || 0, modified: f.modifiedTime || '' });
      }
      setSyncLine(`Checking Google Drive… ${tracks.length} tracks`);
    }
    const order = CFG.collectionOrder.map(normalize);
    seenColl.sort((a, b) => {
      const ia = order.indexOf(normalize(a)), ib = order.indexOf(normalize(b));
      return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib) || a.localeCompare(b);
    });
    const sheets = [];
    if (CFG.sheetsFolder) {
      setSyncLine('Checking sheet music…');
      const stack2 = [{ id: CFG.sheetsFolder, collection: null }];
      while (stack2.length) {
        const { id, collection } = stack2.shift();
        for (const f of await driveList(id)) {
          if (f.mimeType === 'application/vnd.google-apps.folder') { stack2.push({ id: f.id, collection: collection || f.name }); continue; }
          const p = parseSheet(f.name); if (!p) continue;
          sheets.push({ id: f.id, name: f.name, collection: collection || 'Other', number: p.number, title: p.title,
            label: p.label, ext: p.ext, page: p.page, size: +f.size || 0, modified: f.modifiedTime || '' });
        }
        setSyncLine(`Checking sheet music… ${sheets.length} pages`);
      }
      for (const sh of sheets) {   // "Zion's Praises" (sheets) == "Zions Praises" (audio)
        const same = seenColl.find(c => normalize(c) === normalize(sh.collection));
        if (same) sh.collection = same; else if (!seenColl.includes(sh.collection)) seenColl.push(sh.collection);
      }
      seenColl.sort((a, b) => {
        const ia = order.indexOf(normalize(a)), ib = order.indexOf(normalize(b));
        return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib) || a.localeCompare(b);
      });
    }
    const before = library.tracks.length + (library.sheets || []).length;
    library = { tracks, sheets, collections: seenColl, synced: Date.now() };
    store.set('library', library);
    buildIndex(); renderTabs(); search();
    setSyncLine(`${summary()} · updated just now`);
    if (manual) toast(tracks.length + sheets.length === before ? 'Up to date' : `Library updated: ${summary()}`);
  } catch (e) {
    setSyncLine(navigator.onLine ? `Couldn't update: ${e.message}` : 'You\'re offline.', true);
    if (manual) toast(e.message || 'Update failed', 4500);
  } finally {
    syncing = false; $('#syncBtn').classList.remove('spin');
  }
}

function runSearch(q) {
  const fields = {};
  q = q.replace(/(part|book|no|number):("([^"]*)"|(\S+))/gi, (_, k, __, a, b) => { fields[k.toLowerCase()] = normalize(a || b); return ' '; });
  const words = normalize(q.replace(/#/g, ' ')).split(' ').filter(Boolean);
  let pool = songs;
  if (collection === '__saved') pool = pool.filter(s => songFiles(s).some(p => downloaded.has(p.id)));
  else if (collection) pool = pool.filter(s => s.collection === collection);
  if (fields.part) pool = pool.filter(s => s.parts.some(p => normalize(p.part).includes(fields.part)));
  if (fields.book) pool = pool.filter(s => normalize(s.collection).includes(fields.book));
  const num = fields.no || fields.number;
  if (num) pool = pool.filter(s => s.number === num);

  if (!words.length) {
    const list = pool.slice();
    if (sortBy === 'number') list.sort((a, b) => a.collection.localeCompare(b.collection) || (parseInt(a.number) || 1e9) - (parseInt(b.number) || 1e9) || a.nTitle.localeCompare(b.nTitle));
    else if (sortBy === 'recent') list.sort((a, b) => b.modified.localeCompare(a.modified));
    else if (sortBy === 'plays') list.sort((a, b) => songPlays(b) - songPlays(a) || a.nTitle.localeCompare(b.nTitle));
    else list.sort((a, b) => a.nTitle.localeCompare(b.nTitle) || a.collection.localeCompare(b.collection));
    return list.map(s => ({ s, fuzzy: false }));
  }

  const scored = [];
  for (const s of pool) {
    let score = 0, ok = true;
    for (const w of words) {
      if (/^\d+[a-z]?$/.test(w)) {
        if (s.number === w) score += 100;
        else if ((' ' + s.nTitle + ' ').includes(' ' + w + ' ')) score += 20;
        else { ok = false; break; }
      } else if (s.nTitle.startsWith(w)) score += 30;
      else if ((' ' + s.nTitle).includes(' ' + w)) score += 20;
      else if (s.nTitle.includes(w)) score += 10;
      else if (s.nAll.includes(w)) score += 4;
      else { ok = false; break; }
    }

      const tw = s.tWords || (s.tWords = s.nTitle.split(' '));
      const close = textWords.filter(w => tw.some(t => typoMatch(w, t))).length / textWords.length;

}

function typoMatch(a, b) {
  if (a.length < 3 || b.length < 3) return false;
  if (b.startsWith(a) || a.startsWith(b)) return Math.min(a.length, b.length) >= 4;
  const max = a.length >= 7 ? 2 : a.length >= 4 ? 1 : 0;
  if (!max || Math.abs(a.length - b.length) > max) return false;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);

    for (let j = 1; j <= b.length; j++) {

  }

function highlight(text, words) {
  text = String(text || '');
  if (!words.length) return esc(text);
  let f = '', map = [];
  for (let i = 0; i < text.length; i++) for (const ch of fold(text[i])) { f += ch; map.push(i); }
  const ranges = [];
  for (const w of words) { let i = 0; while ((i = f.indexOf(w, i)) !== -1) { ranges.push([map[i], map[i + w.length - 1] + 1]); i += w.length; } }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of ranges) { if (b <= pos) continue; const s = Math.max(a, pos); out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, b)) + '</mark>'; pos = b; }
  return out + esc(text.slice(pos));
}

function pickPart(s, prefer = myPart) {

    const lp = prefer.toLowerCase();
    const hit = p.find(x => x.part.toLowerCase() === lp) || p.find(x => x.part.toLowerCase().startsWith(lp));
    if (hit) return hit;

  return p.find(x => x.part === 'All parts' || x.part === DEFAULT_PART) || p[0];
}

      const allSaved = songFiles(s).every(p => downloaded.has(p.id)), busy = songFiles(s).some(p => downloading.has(p.id));
      const showParts = s.parts.length > 1;
      return `<div class="song${i === sel ? ' sel' : ''}${playing ? ' playing' : ''}" data-i="${i}">
        ${audioLess ? `<button class="play sm" data-act="sheet" aria-label="Sheet music">${ICON_MUSIC}</button>`
          : `<button class="play" data-act="play" aria-label="Play">${playing && !audio.paused ? ICON_PAUSE : ICON_PLAY}</button>`}
        <div class="info" data-act="${audioLess ? 'sheet' : 'play'}">
          <div class="title">${s.number ? `<span class="num">${highlight(s.number, words)}</span>` : ''}${highlight(s.title, words)}${fuzzy ? '<span class="badge">close match</span>' : ''}</div>
          <div class="sub">${highlight(s.collection, words)}${s.subfolder ? ' / ' + esc(s.subfolder) : ''}${audioLess ? ' · Sheet music only' : ''}${!showParts && mine.part && mine.part !== DEFAULT_PART ? ' · ' + highlight(mine.part, words) : ''}${mine.duration ? ' · ' + fmt(mine.duration) : ''}</div>
        </div>
        <div class="acts">${s.sheets.length && !audioLess ? `<button class="dl sm" data-act="sheet" aria-label="Sheet music">${ICON_MUSIC}</button>` : ''}${N ? `<button class="dl${allSaved ? ' done' : ''}${busy ? ' busy' : ''}" data-act="dl" aria-label="${allSaved ? 'Saved' : 'Save offline'}">${allSaved ? ICON_DONE : ICON_DL}</button>` : ''}</div>
        ${showParts ? `<div class="parts">${s.parts.map(p =>
          `<button class="pp${now && now.part === p ? ' now' : ''}${isMine && p === mine ? ' mine' : ''}" data-act="part" data-id="${esc(p.id)}">${highlight(p.part, words)}</button>`).join('')}</div>` : ''}
      </div>`;
    }).join('') + (results.length > limit ? `<div class="empty" style="padding:18px"><button class="chip" id="moreBtn">Show more (${results.length - limit})</button></div>` : '');
  }
  const n = results.length;
  $('#status').textContent = lastQ.trim()
    ? `${n} song${n === 1 ? '' : 's'}${results.some(r => r.fuzzy) ? ' (incl. close matches)' : ''}`
    : `${n} song${n === 1 ? '' : 's'}`;
}
$('#list').addEventListener('click', e => {
  if (e.target.id === 'moreBtn') { limit += LIMIT_STEP; render(); return; }
  const row = e.target.closest('.song'); if (!row) return;
  const s = results[+row.dataset.i].s, btn = e.target.closest('[data-act]'), act = btn && btn.dataset.act;
  sel = +row.dataset.i;
  if (act === 'part') playTrack(s, s.parts.find(p => p.id === btn.dataset.id));
  else if (act === 'dl') toggleDownload(s);
  else if (act === 'sheet') openViewer(s);
  else if (act === 'play') playSong(s);
});

// ------------------------------------------------------------------ offline downloads (Android only)
const mediaUrl = id => `${CFG.driveApi}/drive/v3/files/${encodeURIComponent(id)}?alt=media&key=${encodeURIComponent(CFG.apiKey)}`;
function downloadTracks(files) {
  let started = 0;
  for (const p of files) {
    if (downloaded.has(p.id) || downloading.has(p.id)) continue;
    downloading.add(p.id);
    if (p.ext && N.downloadAs) N.downloadAs(p.id, mediaUrl(p.id), p.ext); else N.download(p.id, mediaUrl(p.id));
    started++;
  }
  return started;
}
function toggleDownload(s) {
  if (!N) return;
  if (songFiles(s).every(p => downloaded.has(p.id))) {
    songFiles(s).forEach(p => { if (!(now && now.part === p)) { N.remove(p.id); downloaded.delete(p.id); } });
    toast('Removed from this device'); renderTabs(); render(); return;
  }
  if (!navigator.onLine) return toast('Connect to the internet to save songs');
  const n = downloadTracks(songFiles(s));
  if (n) toast(`Saving ${s.title} for offline…`);
  render();
}
window.onNativeDownload = (id, ok) => {
  downloading.delete(id);
  if (ok) downloaded.add(id);
  else if (!downloadFailedShown) { downloadFailedShown = true; toast('A download failed. Check your connection and try again.'); setTimeout(() => downloadFailedShown = false, 5000); }
  clearTimeout(window.onNativeDownload.t);
  window.onNativeDownload.t = setTimeout(() => { renderTabs(); render(); updateSheet(); }, 150);
};
let downloadFailedShown = false;

// ------------------------------------------------------------------ player
let queue = [], now = null;   // now = { song, part }
function sourceFor(part) {
  const local = N ? N.localUrl(part.id) : '';
  return local || mediaUrl(part.id);
}
function playSong(s) {
  if (!s.parts.length) return openViewer(s);
  if (now && s.parts.includes(now.part)) return togglePlay();
  queue = results.map(r => r.s).filter(x => x.parts.length);
  playTrack(s, pickPart(s));
}
function playTrack(song, part, keepTime = false) {
  if (now && now.part === part) return togglePlay();
  if (!queue.includes(song)) queue = results.some(r => r.s === song) ? results.map(r => r.s).filter(x => x.parts.length) : [song];
  const t = keepTime ? audio.currentTime : 0, resume = !keepTime || !audio.paused;
  now = { song, part };
  if (!N || !N.localUrl(part.id)) { if (!navigator.onLine) { toast('You\'re offline and this song isn\'t saved'); } }
  audio.src = sourceFor(part);
  audio.playbackRate = +$('#rate').value;
  if (t) audio.addEventListener('loadedmetadata', () => { audio.currentTime = t; }, { once: true });
  if (resume) audio.play().catch(() => {});
  $('#nowTitle').textContent = (song.number ? song.number + '. ' : '') + song.title;
  $('#nowSub').textContent = `${part.part} · ${song.collection}`;
  $('#playerParts').innerHTML = song.parts.length > 1 ? song.parts.map(p =>
    `<button class="pp${p === part ? ' now' : ''}" data-id="${esc(p.id)}">${esc(p.part)}</button>`).join('') : '';
  $('#player').classList.add('show');
  $('#musicBtn').style.display = song.sheets.length ? '' : 'none';
  if (viewing && viewing !== song && song.sheets.length) openViewer(song, true);
  if (!keepTime) { plays[part.id] = (plays[part.id] || 0) + 1; store.set('plays', plays); }
  render();
}
$('#playerParts').addEventListener('click', e => {
  const b = e.target.closest('.pp'); if (!b || !now) return;
  const p = now.song.parts.find(x => x.id === b.dataset.id);
  if (p && p !== now.part) playTrack(now.song, p, true);   // switch part, keep position
});
function step(d) {
  if (!now) return;
  const i = queue.indexOf(now.song), next = queue[i + d];
  if (!next) return toast(d > 0 ? 'End of the list' : 'Start of the list');
  playTrack(next, pickPart(next, myPart || now.part.part));
}
function togglePlay() { if (!now) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); }
window.togglePlay = togglePlay;
function notifyNative() {
  if (!N || !now) return;
  N.playbackState(!audio.paused, (now.song.number ? now.song.number + '. ' : '') + now.song.title, `${now.part.part} · ${now.song.collection}`);
}
function refreshPlaying() { $('#toggleBtn').innerHTML = audio.paused ? BIG_PLAY : BIG_PAUSE; notifyNative(); render(); }
audio.addEventListener('play', refreshPlaying);
audio.addEventListener('pause', refreshPlaying);
audio.addEventListener('ended', () => { if (!audio.loop) step(1); });
audio.addEventListener('loadedmetadata', () => { if (now && isFinite(audio.duration)) now.part.duration = audio.duration; });
audio.addEventListener('error', () => { if (now) toast(navigator.onLine ? 'Couldn\'t play this track. Try Refresh.' : 'You\'re offline and this song isn\'t saved'); });
let seeking = false;
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime) || '0:00';
  $('#len').textContent = fmt(audio.duration) || '0:00';
  if (audio.duration && !seeking) $('#seek').value = audio.currentTime / audio.duration * 1000;
});
$('#seek').addEventListener('input', () => { seeking = true; });
$('#seek').addEventListener('change', e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; seeking = false; });
$('#toggleBtn').onclick = togglePlay;
$('#prevBtn').onclick = () => audio.currentTime > 3 ? (audio.currentTime = 0) : step(-1);
$('#nextBtn').onclick = () => step(1);
$('#backBtn').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 5); };
$('#fwdBtn').onclick = () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 5); };
$('#loopBtn').onclick = () => { audio.loop = !audio.loop; $('#loopBtn').classList.toggle('on', audio.loop); toast(audio.loop ? 'Repeat on' : 'Repeat off', 1200); };
$('#rate').onchange = e => { audio.playbackRate = +e.target.value; };
$('#toggleBtn').innerHTML = BIG_PLAY;
$('#musicBtn').onclick = () => { if (now) openViewer(now.song); };

// ------------------------------------------------------------------ sheet music viewer
let viewing = null, vSheet = null, zoom = 1;
const pdfWaiters = {};
window.onNativePdf = (id, ok, json) => { const cb = pdfWaiters[id]; delete pdfWaiters[id]; if (cb) cb(ok, ok ? JSON.parse(json) : []); };
function sheetSrc(x) { return (N && N.localUrl(x.id)) || mediaUrl(x.id); }
function openViewer(s, keepOpen = false) {
  if (!s.sheets.length) return toast('No sheet music for this song yet');
  viewing = s;
  $('#vTitle').textContent = (s.number ? s.number + '. ' : '') + s.title;
  $('#vSub').textContent = s.collection;
  $('#vPlay').innerHTML = s.parts.length ? (now && s.parts.includes(now.part) && !audio.paused ? BIG_PAUSE : BIG_PLAY).replace(/26/g, '22') : '';
  $('#vPlay').style.visibility = s.parts.length ? '' : 'hidden';
  // group pages by label (e.g. "Vocal · G", "Lead · Ab"); numbered hymns are one group
  const groups = [...new Set(s.sheets.map(x => x.label))];
  $('#vTabs').innerHTML = groups.length > 1 ? groups.map((g, i) => `<button class="pp${i ? '' : ' now'}" data-g="${esc(g)}">${esc(g)}</button>`).join('') : '';
  showSheetGroup(groups[0]);
  $('#viewer').classList.add('show');
  if (N && N.keepScreenOn) N.keepScreenOn(true);
}
function showSheetGroup(label) {
  const pages = viewing.sheets.filter(x => x.label === label);
  vSheet = label; setZoom(1);
  document.querySelectorAll('#vTabs .pp').forEach(b => b.classList.toggle('now', b.dataset.g === label));
  const box = $('#vPages'); box.innerHTML = '';
  $('#vBody').scrollTo(0, 0);
  for (const x of pages) {
    if (x.ext === 'pdf') {
      const holder = document.createElement('div'); box.appendChild(holder);
      if (N && N.renderPdf) {
        holder.innerHTML = '<div class="vmsg">Opening PDF…</div>';
        pdfWaiters[x.id] = (ok, urls) => {
          if (vSheet !== label) return;
          holder.innerHTML = ok ? urls.map(u => `<img src="${esc(u)}" alt="">`).join('')
            : `<div class="vmsg">Couldn't open this PDF.${navigator.onLine ? '' : ' You\'re offline and it isn\'t saved.'}</div>`;
        };
        N.renderPdf(x.id, mediaUrl(x.id));
      } else {
        holder.innerHTML = `<div class="vmsg"><a href="https://drive.google.com/file/d/${encodeURIComponent(x.id)}/view" target="_blank" rel="noopener">Open “${esc(x.name)}”</a></div>`;
      }
    } else {
      const img = new Image(); img.alt = ''; img.src = sheetSrc(x);
      img.onerror = () => { img.replaceWith(Object.assign(document.createElement('div'), { className: 'vmsg', textContent: navigator.onLine ? 'Couldn\'t load this page.' : 'You\'re offline and this page isn\'t saved.' })); };
      box.appendChild(img);
    }
  }
}
function closeViewer() {
  viewing = null; vSheet = null;
  $('#viewer').classList.remove('show');
  if (N && N.keepScreenOn) N.keepScreenOn(false);
}
$('#vClose').onclick = closeViewer;
$('#vTabs').addEventListener('click', e => { const b = e.target.closest('.pp'); if (b) showSheetGroup(b.dataset.g); });
$('#vPlay').onclick = () => {
  if (!viewing || !viewing.parts.length) return;
  if (now && viewing.parts.includes(now.part)) togglePlay(); else { queue = [viewing]; playTrack(viewing, pickPart(viewing)); }
};
audio.addEventListener('play', () => { if (viewing) openViewerButtons(); });
audio.addEventListener('pause', () => { if (viewing) openViewerButtons(); });
function openViewerButtons() {
  $('#vPlay').innerHTML = (now && viewing.parts.includes(now.part) && !audio.paused ? BIG_PAUSE : BIG_PLAY).replace(/26/g, '22');
}

// Pinch / double-tap / buttons to zoom, keeping the spot under your fingers in place.
function setZoom(z, cx, cy) {
  const body = $('#vBody'), pages = $('#vPages');
  z = Math.min(4, Math.max(1, z));
  const r = body.getBoundingClientRect();
  cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  const fx = (body.scrollLeft + cx) / (pages.offsetWidth || 1), fy = (body.scrollTop + cy) / (pages.offsetHeight || 1);
  zoom = z; pages.style.width = (z * 100) + '%';
  body.scrollLeft = fx * pages.offsetWidth - cx; body.scrollTop = fy * pages.offsetHeight - cy;
}
$('#zIn').onclick = () => setZoom(zoom * 1.5);
$('#zOut').onclick = () => setZoom(zoom / 1.5);
(() => {
  const body = $('#vBody'); let start = null, lastTap = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  body.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const r = body.getBoundingClientRect();
      start = { d: dist(e.touches), z: zoom, cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top };
    } else if (e.touches.length === 1) {
      const t = Date.now();
      if (t - lastTap < 300) { const r = body.getBoundingClientRect(); setZoom(zoom > 1.2 ? 1 : 2.5, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); e.preventDefault(); }
      lastTap = t;
    }
  }, { passive: false });
  body.addEventListener('touchmove', e => {
    if (start && e.touches.length === 2) { e.preventDefault(); setZoom(start.z * dist(e.touches) / start.d, start.cx, start.cy); }
  }, { passive: false });
  body.addEventListener('touchend', e => { if (e.touches.length < 2) start = null; });
})();

// ------------------------------------------------------------------ menu sheet
function openSheet() { updateSheet(); $('#sheet').classList.add('show'); $('#sheetBg').classList.add('show'); }
function closeSheet() { $('#sheet').classList.remove('show'); $('#sheetBg').classList.remove('show'); }
function updateSheet() {
  const mb = N ? (N.downloadedBytes() / 1048576).toFixed(0) : 0;
  $('#storageInfo').textContent = N ? `${downloaded.size} file${downloaded.size === 1 ? '' : 's'} saved on this device (${mb} MB).` : 'Offline saving isn\'t available in this browser.';
  const scope = collection && collection !== '__saved' ? collection : 'all books';
  $('#dlPartBtn').textContent = `Save every song in ${scope} for offline`;
  $('#dlPartBtn').style.display = N ? '' : 'none';
  $('#clearDlBtn').style.display = N && downloaded.size ? '' : 'none';
  $('#aboutLine').textContent = `${summary()} · ${library.synced ? 'updated ' + ago(library.synced) : 'not updated yet'}`;
}
let theme = store.get('theme', 'system');
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === theme));
  const dark = theme === 'dark' || (theme === 'system' && darkQuery.matches);
  if (N && N.setSystemBars) N.setSystemBars(dark ? '#141013' : '#f7f2f4', !dark);
}
$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.t; store.set('theme', theme); applyTheme();
});
darkQuery.addEventListener('change', () => { if (theme === 'system') applyTheme(); });
applyTheme();
$('#menuBtn').onclick = openSheet;
$('#sheetBg').onclick = closeSheet;
$('#dlPartBtn').onclick = () => {
  if (!navigator.onLine) return toast('Connect to the internet to save songs');
  const pool = songs.filter(s => !collection || collection === '__saved' || s.collection === collection);
  const tracks = pool.flatMap(songFiles);
  const mb = tracks.filter(p => !downloaded.has(p.id)).reduce((n, p) => n + p.size, 0) / 1048576;
  if (!tracks.length) return toast('Nothing to save');
  if (mb > 200 && !confirm(`This will download about ${mb.toFixed(0)} MB. Continue?`)) return;
  const n = downloadTracks(tracks);
  toast(n ? `Saving ${n} file${n === 1 ? '' : 's'}… you can keep using the app` : 'Already saved');
  closeSheet(); render();
};
$('#clearDlBtn').onclick = () => {
  if (!confirm('Remove all saved songs from this device?')) return;
  N.removeAll(); downloaded.clear(); if (collection === '__saved') collection = '';
  renderTabs(); search(); updateSheet(); toast('Saved songs removed');
};

// Android back button: close the sheet / clear the search first.
window.handleBack = () => {
  if ($('#lock').classList.contains('show')) return false;
  if (viewing) { closeViewer(); return true; }
  if ($('#sheet').classList.contains('show')) { closeSheet(); return true; }
  if ($('#q').value) { $('#q').value = ''; search(); return true; }
  return false;
};

// ------------------------------------------------------------------ password (asked once per phone)
// Small SHA-256 so the password itself isn't stored in the app.
function sha256(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = [...new TextEncoder().encode(str)], len = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (len >>> (i * 8)) & 255);
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], w = new Array(64);
  const rot = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[o+4*i] << 24) | (bytes[o+4*i+1] << 16) | (bytes[o+4*i+2] << 8) | bytes[o+4*i+3];
    for (let i = 16; i < 64; i++) {
      const s0 = rot(w[i-15], 7) ^ rot(w[i-15], 18) ^ (w[i-15] >>> 3), s1 = rot(w[i-2], 17) ^ rot(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const needsPassword = () => CFG.passwordHash && store.get('unlocked', '') !== CFG.passwordHash;
$('#lockTitle').textContent = CFG.appName;
$('#lockForm').addEventListener('submit', e => {
  e.preventDefault();
  if (sha256($('#lockPw').value) === CFG.passwordHash) {
    store.set('unlocked', CFG.passwordHash);
    $('#lock').classList.remove('show'); $('#lockPw').blur();
    startApp();
  } else {
    $('#lockErr').textContent = 'That password isn\'t right.'; $('#lockPw').select();
  }
});

// ------------------------------------------------------------------ start
function startApp() {
  if (!library.synced || Date.now() - library.synced > CFG.syncMinutes * 60000 || !library.sheets) sync();
}
refreshDownloaded();
buildIndex(); renderTabs(); search();
if (N && N.ready) N.ready.then(() => { refreshDownloaded(); renderTabs(); render(); });
(() => {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (N && N.isWeb && ios && !standalone && !store.get('installTipClosed', false)) $('#installTip').classList.add('show');
  $('#installClose').onclick = () => { $('#installTip').classList.remove('show'); store.set('installTipClosed', true); };
})();
if (library.synced) setSyncLine(`${summary()} · updated ${ago(library.synced)}`);
if (needsPassword()) { $('#lock').classList.add('show'); setTimeout(() => $('#lockPw').focus(), 300); }
else startApp();
window.addEventListener('online', () => { if (!needsPassword() && Date.now() - library.synced > CFG.syncMinutes * 60000) sync(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !needsPassword() && Date.now() - library.synced > CFG.syncMinutes * 60000) sync();
});
</script>
